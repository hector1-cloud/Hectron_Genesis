name: Release Hectron APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      - name: Build APK
        run: flet build apk --verbose
        env:
          FLET_CLI_NO_RICH_OUTPUT: 1

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: HECTRON-Ψ ${{ github.ref_name }}
          body: |
            ## HECTRON-Ψ Unicornio Negro Protocol
            
            **Versión:** ${{ github.ref_name }}
            
            ### Contenido
            - APK listo para instalar
            - Núcleo Abada + Omega Matrix
            - Dashboard Flet nativo
            
            **Hecho está.**  
            Solve et Coagula. 🦏⚫
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
